services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  sandbox-runner:
    build:
      context: ./Backend/sandbox
      dockerfile: Dockerfile
    image: sandbox-runner:latest
    # This is a build-only service — the image is used by the API via dockerode

  api:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/collab-editor
      - JWT_SECRET=dev-secret-change-in-production
      - CLIENT_URL=http://localhost:5173
      - PORT=3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mongo-data:
