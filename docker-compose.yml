services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  sandbox-runner:
    build:
      context: ./Backend/sandbox
      dockerfile: Dockerfile
    image: sandbox-runner:latest
    # This is a build-only service — the image is used by the API via dockerode

  terminal-sandbox:
    build:
      context: ./Backend/sandbox
      dockerfile: terminal.Dockerfile
    image: opencode-terminal:latest
    # Build-only service — the image is used on-demand by terminalManager.js via dockerode

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - livekit
    environment:
      - MONGODB_URI=mongodb://mongo:27017/collab-editor
      - JWT_SECRET=dev-secret-change-in-production
      - CLIENT_URL=http://localhost:5173
      - PORT=3000
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret-dev-key-change-in-production
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_WS_URL=ws://localhost:7880
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mongo-data:
